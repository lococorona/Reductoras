      <text x="22" y="30" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">L</text>
      
      <rect x="52" y="0" width="44" height="44" rx="8" fill="#64748B" />
      <text x="74" y="30" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">E</text>
      
